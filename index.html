<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sürpriz 🎁</title>

  <style>
    body {
      font-family: system-ui, Arial;
      margin: 0;
      background: #0b0b10;
      color: #fff;
    }

    header {
      padding: 28px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      opacity: .85;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 14px 40px;
    }

    /* ALT ALTA GÖSTERİM */
    .list img {
      width: 100%;
      margin-bottom: 16px;
      border-radius: 16px;
      object-fit: cover;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 16px;
    }

    .hint {
      text-align: center;
      opacity: .7;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>İyi ki varsın 💛</h1>
    <p>Bu sayfa sadece senin için.</p>
  </header>

  <div class="wrap">
    <div class="hint">Fotoğrafa dokun → büyüt ✨</div>
    <div class="list" id="list"></div>
  </div>

  <div class="modal" id="modal" onclick="closeModal()">
    <img id="modalImg">
  </div>

  <script>
    const MAX = 50; // 👈 en fazla kaç foto olabilir (artırabilirsin)

    const list = document.getElementById("list");

    for (let i = 1; i <= MAX; i++) {
      const img = document.createElement("img");
      img.src = `photos/${i}.jpeg`;
      img.loading = "lazy";

      // Foto yoksa otomatik gizle
      img.onerror = () => img.remove();

      img.onclick = () => openModal(img.src);

      list.appendChild(img);
    }

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src) {
      modalImg.src = src;
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
      modalImg.src = "";
    }
  </script>
</body>
</html>
